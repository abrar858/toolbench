<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toolbench: free online tools that run in your browser</title>
<meta name="description" content="Free online tools: word counter, password generator, unit converter, JSON formatter, UK take-home pay, loan and savings calculators. Nothing is uploaded.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1F6;--surface:#FFFFFF;--ink:#14233D;--muted:#55667F;--line:#D3DBE6;--accent:#F2C230;--teal:#1E7A6C;--err:#B42318;--field:#F6F8FB;
  --head:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;--body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E192B;--surface:#16233A;--ink:#E7EDF6;--muted:#9AAAC2;--line:#2A3B57;--teal:#4CC2AE;--err:#FF8A80;--field:#0E192B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E192B;--surface:#16233A;--ink:#E7EDF6;--muted:#9AAAC2;--line:#2A3B57;--teal:#4CC2AE;--err:#FF8A80;--field:#0E192B;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--body)}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font:800 1.35rem/1 var(--head);text-decoration:none;letter-spacing:-.01em}
.logo i{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font-style:normal;font-size:1rem}
.top nav{display:flex;gap:18px;font-weight:500}
.top nav a{text-decoration:none;color:var(--muted)}
.top nav a:hover{color:var(--ink)}
h1{font:800 clamp(2.3rem,6.5vw,4.2rem)/1.02 var(--head);letter-spacing:-.025em;margin:44px 0 14px;max-width:13ch}
.lede{color:var(--muted);max-width:50ch;margin:0;font-size:1.08rem}
.search{position:relative;margin:32px 0 0;max-width:720px}
.search svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;font:500 1.2rem var(--body);padding:18px 20px 18px 56px;border:2px solid var(--ink);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:6px 6px 0 var(--accent)}
.search input::placeholder{color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px 44px;margin:56px 0 64px}
.cat h2{display:flex;justify-content:space-between;align-items:baseline;font:700 1.25rem var(--head);margin:0;padding-bottom:10px;border-bottom:2px solid var(--ink);scroll-margin-top:20px}
.cat h2 small{font:500 .85rem var(--body);color:var(--muted)}
.cat ul{list-style:none;margin:0 0 24px;padding:0}
.cat li a{display:block;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}
.cat li strong{display:block;font-weight:600}
.cat li span{color:var(--muted);font-size:.92rem}
.cat li a:hover strong,.cat li a:focus-visible strong{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:4px}
.empty{color:var(--muted);margin:40px 0}
.back{display:inline-block;margin-top:28px;color:var(--muted);text-decoration:none;font-weight:500}
.back:hover{color:var(--ink)}
.tool h1{font-size:clamp(2rem,5vw,3rem);margin:14px 0 8px;max-width:none}
.panel{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:24px;box-shadow:6px 6px 0 var(--accent);margin:28px 0 40px;max-width:820px}
label{display:block;font-weight:600;font-size:.92rem;margin:0 0 6px}
input,select,textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:170px;resize:vertical;line-height:1.5}
.mono{font-family:var(--mono);font-size:.92rem}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--teal)}
input[type=range]{padding:0;accent-color:var(--teal)}
input[type=color]{padding:2px;height:46px;width:70px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.check{display:flex;align-items:center;gap:8px;font-weight:500;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
button{font:600 .95rem var(--body);padding:10px 16px;border-radius:8px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer}
button:hover{background:var(--field)}
button.primary{background:var(--accent);border-color:#14233D;color:#14233D}
button.primary:hover{filter:brightness(1.05)}
.out{background:var(--field);border-radius:10px;padding:16px;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.stat b{display:block;font:700 1.6rem/1.2 var(--head)}
.stat span{color:var(--muted);font-size:.88rem}
.big{font:800 clamp(1.8rem,5vw,2.4rem)/1.15 var(--head);margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.err{color:var(--err);font-weight:500}
.ok{color:var(--teal);font-weight:600}
.note{font-size:.88rem;color:var(--muted);margin:14px 0 0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:.9rem}
tr.total td{font-weight:700;border-bottom:none}
.pc{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.pc:last-child{border-bottom:none}
.pc input{width:120px}
.pc output{font:700 1.3rem var(--head);margin-left:6px}
.hashes div{margin-bottom:12px}
.hashes code{display:block;word-break:break-all;font:.88rem var(--mono);background:var(--field);padding:10px;border-radius:8px;margin:4px 0}
.swatch{width:100%;height:80px;border-radius:10px;border:1px solid var(--line);margin-bottom:12px}
.kv{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;margin-bottom:8px}
.kv code{font:.95rem var(--mono)}
.kv button{padding:6px 12px}
.related h2{font:700 1.15rem var(--head);margin:0 0 6px}
.related ul{list-style:none;padding:0;margin:0 0 56px;display:flex;flex-wrap:wrap;gap:8px}
.related a{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;background:var(--surface)}
.related a:hover{border-color:var(--ink)}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:.9rem}
footer p{margin:4px 0}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
@media (max-width:560px){.panel{padding:18px;box-shadow:4px 4px 0 var(--accent)}.search input{font-size:1.05rem}h1{margin-top:28px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="#"><i>🧰</i><span id="siteName">Toolbench</span></a>
    <nav aria-label="Categories"><a href="#general">General</a><a href="#advanced">Advanced</a><a href="#finance">Finance</a></nav>
  </header>
</div>
<main id="app"></main>
<footer><div class="wrap">
  <p>Every tool runs in your browser. Nothing you type is uploaded or stored.</p>
  <p>Finance results are estimates for guidance only, not financial advice.</p>
  <p>© <span id="yr"></span> <span class="sn">Toolbench</span></p>
</div></footer>

<script>
const SITE = "Toolbench"; // change this to your brand name
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const num = v => parseFloat(String(v).replace(/[,£\s]/g, ""));
const gbp = n => isFinite(n) ? n.toLocaleString("en-GB", {style: "currency", currency: "GBP"}) : "–";
const nf = (n, d = 2) => isFinite(n) ? n.toLocaleString("en-GB", {maximumFractionDigits: d}) : "–";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const stats = a => a.map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
function copy(text, btn) {
  const done = t => { const o = btn.textContent; btn.textContent = t; setTimeout(() => btn.textContent = o, 1200); };
  if (!text) return done("Nothing to copy");
  navigator.clipboard.writeText(text).then(() => done("Copied"), () => done("Copy failed"));
}
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const dur = m => { const y = Math.floor(m / 12), r = m % 12; return [y && plural(y, "year"), r && plural(r, "month")].filter(Boolean).join(" ") || "0 months"; };
let cleanup = null;

// Two-way text tool used by Base64 and URL encoder
function twoWay(enc, dec, encLabel, decLabel, errMsg) {
  return {
    ui: `<label for="tw-in">Input</label><textarea id="tw-in" class="mono" placeholder="Paste text here"></textarea>
      <div class="btns"><button class="primary" data-a="e">${encLabel}</button><button data-a="d">${decLabel}</button></div>
      <label for="tw-out">Result</label><textarea id="tw-out" class="mono" readonly></textarea>
      <div class="btns"><button data-a="c">Copy result</button></div><p class="msg" aria-live="polite"></p>`,
    init(el) {
      const i = $("#tw-in", el), o = $("#tw-out", el), m = $(".msg", el);
      el.addEventListener("click", e => {
        const a = e.target.dataset.a; if (!a) return;
        if (a === "c") return copy(o.value, e.target);
        m.textContent = ""; m.className = "msg";
        try { o.value = a === "e" ? enc(i.value) : dec(i.value); }
        catch { o.value = ""; m.textContent = errMsg; m.className = "msg err"; }
      });
    }
  };
}

const UNITS = {
  Length: {Millimetres: .001, Centimetres: .01, Metres: 1, Kilometres: 1000, Inches: .0254, Feet: .3048, Yards: .9144, Miles: 1609.344},
  Weight: {Grams: .001, Kilograms: 1, Ounces: .028349523125, Pounds: .45359237, Stone: 6.35029318, Tonnes: 1000},
  Volume: {Millilitres: .001, Litres: 1, "UK pints": .56826125, "UK gallons": 4.54609, "US cups": .2365882365, "US gallons": 3.785411784},
  Temperature: {Celsius: 0, Fahrenheit: 0, Kelvin: 0},
  Speed: {"Metres per second": 1, "Kilometres per hour": 1 / 3.6, "Miles per hour": .44704, Knots: .514444}
};
const toC = {Celsius: x => x, Fahrenheit: x => (x - 32) * 5 / 9, Kelvin: x => x - 273.15};
const fromC = {Celsius: c => c, Fahrenheit: c => c * 9 / 5 + 32, Kelvin: c => c + 273.15};

function ukPay(gross, pct) {
  const pen = gross * pct / 100, inc = gross - pen;
  const pa = inc > 100000 ? Math.max(0, 12570 - (inc - 100000) / 2) : 12570;
  const ti = Math.max(0, inc - pa);
  const tax = Math.min(ti, 37700) * .2 + Math.max(0, Math.min(ti, 125140) - 37700) * .4 + Math.max(0, ti - 125140) * .45;
  const ni = Math.max(0, Math.min(gross, 50270) - 12570) * .08 + Math.max(0, gross - 50270) * .02;
  return {gross, pen, tax, ni, net: gross - pen - tax - ni};
}
function payoff(bal, r, pay) {
  let months = 0, interest = 0;
  while (bal > .005 && months < 1200) { const i = bal * r; interest += i; bal = bal + i - pay; months++; }
  return {months, interest};
}

const TOOLS = [
/* ---------- GENERAL ---------- */

{id: "date-difference", cat: "general", name: "Date difference calculator", desc: "Count calendar days and weeks between two dates.",
 ui: `<div class="row"><div><label for="dd-start">Start date</label><input id="dd-start" type="date"></div><div><label for="dd-end">End date</label><input id="dd-end" type="date"></div></div><label class="check"><input id="dd-inclusive" type="checkbox"> Include both start and end dates</label><div class="out" id="dd-result" aria-live="polite"></div><p class="note">Counts calendar days, including weekends and bank holidays. Time zones and daylight saving do not change the result.</p>`,
 init(el) {
  const parse = s => {
   if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return NaN;
   const [y,m,d] = s.split("-").map(Number);
   const t = new Date(0); t.setUTCFullYear(y,m-1,d); t.setUTCHours(0,0,0,0);
   return t.getUTCFullYear() === y && t.getUTCMonth() === m-1 && t.getUTCDate() === d ? t.getTime() : NaN;
  };
  const run = () => {
   const a = parse($("#dd-start",el).value), b = parse($("#dd-end",el).value), o = $("#dd-result",el);
   if (!Number.isFinite(a) || !Number.isFinite(b)) { o.innerHTML = '<p class="sub">Choose two valid dates.</p>'; return; }
   if (b < a) { o.innerHTML = '<p class="err">End date must be on or after start date.</p>'; return; }
   const days = Math.round((b-a)/86400000) + ($("#dd-inclusive",el).checked ? 1 : 0);
   o.innerHTML = '<p class="big">' + plural(days,"day") + '</p><p class="sub">' + plural(Math.floor(days/7),"week") + ' and ' + plural(days%7,"day") + '</p>';
  };
  el.addEventListener("input",run); el.addEventListener("change",run); run();
 }},


{id: "bmi-calculator", cat: "general", name: "BMI calculator", desc: "Calculate adult body mass index using metric or imperial measurements.",
 ui: `<p class="note" style="margin-top:0">For adults aged 18 and over. Not suitable during pregnancy.</p>
 <div class="row"><div><label for="bmi-units">Units</label><select id="bmi-units"><option value="metric">Metric (cm and kg)</option><option value="imperial">Imperial (feet, inches, stone and pounds)</option></select></div></div>
 <div id="bmi-metric" class="row"><div><label for="bmi-cm">Height (cm)</label><input id="bmi-cm" type="number" inputmode="decimal" min="1" step="any" placeholder="e.g. 175"></div><div><label for="bmi-kg">Weight (kg)</label><input id="bmi-kg" type="number" inputmode="decimal" min="1" step="any" placeholder="e.g. 70"></div></div>
 <div id="bmi-imperial" hidden><div class="row"><div><label for="bmi-ft">Height (feet)</label><input id="bmi-ft" type="number" inputmode="numeric" min="0" step="1"></div><div><label for="bmi-in">Extra inches</label><input id="bmi-in" type="number" inputmode="decimal" min="0" max="11.99" step="any" value="0"></div></div><div class="row"><div><label for="bmi-st">Weight (stone)</label><input id="bmi-st" type="number" inputmode="numeric" min="0" step="1"></div><div><label for="bmi-lb">Extra pounds</label><input id="bmi-lb" type="number" inputmode="decimal" min="0" max="13.99" step="any" value="0"></div></div></div>
 <div class="out" id="bmi-result" aria-live="polite"></div>
 <p class="note">BMI = weight (kg) ÷ height (metres)². Standard adult categories are shown. For South Asian, Chinese, other Asian, Middle Eastern, Black African and African–Caribbean backgrounds, overweight starts at 23 and obesity at 27.5. BMI cannot distinguish muscle from fat and needs careful interpretation in older adults. It is a screening estimate, not a diagnosis.</p>
 <p class="note"><a href="https://www.nhs.uk/conditions/overweight-and-obesity/" target="_blank" rel="noopener">Read NHS guidance about BMI</a></p>`,
 init(el) {
  const val = id => { const s = $("#" + id, el).value.trim(); return s === "" ? NaN : Number(s); };
  const run = () => {
   const metric = $("#bmi-units", el).value === "metric";
   $("#bmi-metric", el).hidden = !metric; $("#bmi-imperial", el).hidden = metric;
   const o = $("#bmi-result", el);
   let h, w;
   if (metric) { h = val("bmi-cm") / 100; w = val("bmi-kg"); }
   else {
    const ft = val("bmi-ft"), inch = val("bmi-in"), st = val("bmi-st"), lb = val("bmi-lb");
    if (![ft, inch, st, lb].every(Number.isFinite) || ft < 0 || st < 0 || !Number.isInteger(ft) || !Number.isInteger(st) || inch < 0 || inch >= 12 || lb < 0 || lb >= 14) {
     o.innerHTML = '<p class="sub">Enter feet and stone as whole numbers, extra inches from 0 to less than 12, and extra pounds from 0 to less than 14.</p>'; return;
    }
    h = (ft * 12 + inch) * .0254; w = (st * 14 + lb) * .45359237;
   }
   if (!Number.isFinite(h) || !Number.isFinite(w) || h <= 0 || w <= 0) { o.innerHTML = '<p class="sub">Enter a positive height and weight to calculate your BMI.</p>'; return; }
   const bmi = w / (h * h);
   if (!Number.isFinite(bmi) || bmi <= 0) { o.innerHTML = '<p class="err">Please check your measurements.</p>'; return; }
   const category = bmi < 18.5 ? "Underweight" : bmi < 25 ? "Healthy weight" : bmi < 30 ? "Overweight" : "Obesity";
   o.innerHTML = '<p class="sub">Your BMI</p><p class="big">' + bmi.toFixed(1) + '</p><p class="sub">' + category + ' (standard adult category)</p>';
  };
  el.addEventListener("input", run); el.addEventListener("change", run); run();
 }},

{id: "word-counter", cat: "general", name: "Word counter", desc: "Count words, characters, sentences and reading time.",
 ui: `<label for="wc">Your text</label><textarea id="wc" placeholder="Type or paste text here"></textarea><div class="out stats" id="wcs" aria-live="polite"></div>`,
 init(el) {
  const t = $("#wc", el), o = $("#wcs", el);
  const run = () => {
    const s = t.value, words = (s.trim().match(/\S+/g) || []).length;
    const sent = (s.match(/[^.!?]+[.!?]+/g) || []).length || (s.trim() ? 1 : 0);
    o.innerHTML = stats([[words, "Words"], [s.length, "Characters"], [s.replace(/\s/g, "").length, "Without spaces"], [sent, "Sentences"],
      [s.split(/\n\s*\n/).filter(p => p.trim()).length, "Paragraphs"], [Math.ceil(words / 200) + " min", "Reading time"]]);
  };
  t.addEventListener("input", run); run();
 }},
{id: "case-converter", cat: "general", name: "Case converter", desc: "Switch text to UPPER, lower, Title, camelCase and more.",
 ui: `<label for="cc">Your text</label><textarea id="cc" placeholder="Type or paste text here"></textarea>
  <div class="btns"><button data-c="upper">UPPER CASE</button><button data-c="lower">lower case</button><button data-c="title">Title Case</button><button data-c="sentence">Sentence case</button><button data-c="camel">camelCase</button><button data-c="snake">snake_case</button><button data-c="kebab">kebab-case</button></div>
  <div class="btns"><button class="primary" data-c="copy">Copy text</button></div>`,
 init(el) {
  const t = $("#cc", el);
  const words = s => s.replace(/([a-z0-9])([A-Z])/g, "$1 $2").split(/[^A-Za-z0-9]+/).filter(Boolean);
  const f = {
    upper: s => s.toUpperCase(), lower: s => s.toLowerCase(),
    title: s => s.toLowerCase().replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase()),
    sentence: s => s.toLowerCase().replace(/(^\s*\S|[.!?]\s+\S)/g, c => c.toUpperCase()),
    camel: s => words(s).map((w, i) => i ? w[0].toUpperCase() + w.slice(1).toLowerCase() : w.toLowerCase()).join(""),
    snake: s => words(s).map(w => w.toLowerCase()).join("_"),
    kebab: s => words(s).map(w => w.toLowerCase()).join("-")
  };
  el.addEventListener("click", e => { const c = e.target.dataset.c; if (!c) return; if (c === "copy") copy(t.value, e.target); else t.value = f[c](t.value); });
 }},
{id: "password-generator", cat: "general", name: "Password generator", desc: "Strong random passwords, made on your device.",
 ui: `<label for="pl">Length: <span id="plv">16</span></label><input type="range" id="pl" min="8" max="64" value="16">
  <div class="row" style="margin-top:16px"><label class="check"><input type="checkbox" id="pu" checked> Capital letters</label><label class="check"><input type="checkbox" id="pw" checked> Small letters</label><label class="check"><input type="checkbox" id="pd" checked> Numbers</label><label class="check"><input type="checkbox" id="ps" checked> Symbols</label></div>
  <div class="out"><p class="big mono" id="po" style="font-family:var(--mono);font-size:1.3rem;word-break:break-all"></p><p class="sub" id="pst"></p></div>
  <div class="btns"><button class="primary" id="pg">Generate new password</button><button id="pc">Copy password</button></div>`,
 init(el) {
  const sets = {pu: "ABCDEFGHIJKLMNOPQRSTUVWXYZ", pw: "abcdefghijklmnopqrstuvwxyz", pd: "0123456789", ps: "!@#$%^&*()-_=+[]{};:,.?/"};
  const rnd = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
  const gen = () => {
    const len = +$("#pl", el).value; $("#plv", el).textContent = len;
    const on = Object.keys(sets).filter(k => $("#" + k, el).checked);
    if (!on.length) { $("#po", el).textContent = ""; $("#pst", el).innerHTML = `<span class="err">Tick at least one type of character.</span>`; return; }
    const pool = on.map(k => sets[k]).join("");
    let p;
    do { p = Array.from({length: len}, () => pool[rnd(pool.length)]).join(""); } while (!on.every(k => [...p].some(c => sets[k].includes(c))));
    $("#po", el).textContent = p;
    const bits = Math.round(len * Math.log2(pool.length));
    $("#pst", el).textContent = `${bits < 50 ? "Fair" : bits < 75 ? "Strong" : "Very strong"} (${bits} bits of randomness)`;
  };
  el.addEventListener("input", gen); $("#pg", el).onclick = gen;
  $("#pc", el).onclick = e => copy($("#po", el).textContent, e.target); gen();
 }},
{id: "unit-converter", cat: "general", name: "Unit converter", desc: "Length, weight, volume, temperature and speed.",

{id: "colour-converter", cat: "advanced", name: "Colour converter", desc: "Convert between HEX, RGB and HSL.",
 ui: `<div class="row" style="align-items:end"><div><label for="cp">Pick a colour</label><input type="color" id="cp" value="#1e7a6c"></div><div><label for="ch">Or type a HEX code</label><input id="ch" class="mono" value="#1e7a6c"></div></div>
  <div class="swatch" id="cs"></div><div id="co"></div><p id="cm" class="err" aria-live="polite"></p>`,
 init(el) {
  const show = hex => {
    let h = hex.trim().replace(/^#/, "");
    if (/^[0-9a-f]{3}$/i.test(h)) h = [...h].map(c => c + c).join("");
    if (!/^[0-9a-f]{6}$/i.test(h)) return $("#cm", el).textContent = "Enter a HEX code like #1e7a6c or #fff.";

    const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
    const R = r / 255, G = g / 255, B = b / 255, mx = Math.max(R, G, B), mn = Math.min(R, G, B), l = (mx + mn) / 2, dd = mx - mn;
    let hh = 0, s = 0;
    if (dd) { s = dd / (1 - Math.abs(2 * l - 1)); hh = mx === R ? ((G - B) / dd) % 6 : mx === G ? (B - R) / dd + 2 : (R - G) / dd + 4; hh = Math.round(hh * 60 + 360) % 360; }
    const vals = {HEX: "#" + h.toLowerCase(), RGB: `rgb(${r}, ${g}, ${b})`, HSL: `hsl(${hh}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%)`};
    $("#cs", el).style.background = vals.HEX; $("#cp", el).value = vals.HEX;
    $("#co", el).innerHTML = Object.entries(vals).map(([k, v]) => `<div class="kv"><b>${k}</b><code>${v}</code><button data-v="${v}">Copy</button></div>`).join("");

  $('meta[name="description"]').content = `${t.desc} Free, no sign-up, works in your browser.`;
  const rel = TOOLS.filter(x => x.cat === t.cat && x.id !== t.id);
  app.innerHTML = `<div class="wrap tool"><a class="back" href="#${t.cat}">All ${CATS.find(c => c.id === t.cat).name.toLowerCase()} tools</a>
    <h1>${t.name}</h1><p class="lede">${t.desc}</p><div class="panel">${t.ui}</div>
    <div class="related"><h2>More tools</h2><ul>${rel.map(x => `<li><a href="#${x.id}">${x.name}</a></li>`).join("")}</ul></div></div>`;
  t.init($(".panel"));
  window.scrollTo(0, 0);
}

function route() {
  if (cleanup) { cleanup(); cleanup = null; }
  const id = location.hash.slice(1), t = TOOLS.find(x => x.id === id);
  if (t) showTool(t); else showHome(CATS.some(c => c.id === id) ? id : null);
}
$("#siteName").textContent = SITE; $$(".sn").forEach(s => s.textContent = SITE);
$("#yr").textContent = new Date().getFullYear();
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
