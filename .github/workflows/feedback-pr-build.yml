name: Build feedback pull request
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == 'abrar858/toolbench' && github.event.pull_request.head.ref == 'feature/tool-feedback-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tool-feedback-20261118
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build generated site
        run: node scripts/build.mjs
      - name: Commit generated pages
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "build: generate feedback-enabled pages"
            git push origin HEAD:feature/tool-feedback-20261118
          fi
      - name: Check build and tests
        run: |
          node scripts/build.mjs --check
          node --test tests/*.test.mjs
