name: Build feedback pull request
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == 'abrar858/toolbench' && github.event.pull_request.head.ref == 'feature/tool-feedback-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tool-feedback-20261118
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build generated site
        run: node scripts/build.mjs
      - name: Commit generated pages
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "build: generate feedback-enabled pages"
            git push origin HEAD:feature/tool-feedback-20261118
          fi
      - name: Check build and tests
        run: |
          node scripts/build.mjs --check
          node --test tests/*.test.mjs
      - name: Verify live feedback endpoint
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://egypshduxktdyubwiaoo.supabase.co/functions/v1/submit-feedback"
          code=$(curl --retry 2 --retry-delay 2 --max-time 20 -sS -o /tmp/feedback-response -w '%{http_code}' -H 'Origin: https://toolsbravo.com' -H 'Content-Type: application/json' -d '{"tool_slug":"ci-feedback","category":"bug","message":"Automated integration test"}' "$endpoint")
          cat /tmp/feedback-response
          test "$code" = 201
          code=$(curl --max-time 20 -sS -o /tmp/feedback-invalid -w '%{http_code}' -H 'Origin: https://toolsbravo.com' -H 'Content-Type: application/json' -d '{"tool_slug":"bad slug","category":"review","message":"invalid"}' "$endpoint")
          test "$code" = 400
          code=$(curl --max-time 20 -sS -o /tmp/feedback-cors -w '%{http_code}' -H 'Origin: https://untrusted.example' -H 'Content-Type: application/json' -d '{"tool_slug":"ci-feedback","category":"bug","message":"Invalid origin test"}' "$endpoint")
          test "$code" = 403

