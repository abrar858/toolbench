name: Toolbench browser smoke tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static web server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/toolbench-http.log 2>&1 &
      - name: Run browser tests
        run: npx playwright test tests/browser.spec.mjs --config=playwright.config.mjs
