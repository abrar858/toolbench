name: ToolsBravo static checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generated pages and asset cache versions
        run: node scripts/build.mjs --check
      - name: Run static and calculator checks
        run: node --test tests/site.test.mjs
