name: Verify ToolsBravo feedback production
on:
  push:
    branches: [main]
    paths-ignore: ['docs/production-verification.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify live feedback pages
        shell: bash
        run: |
          set -euo pipefail
          sleep 25
          for attempt in $(seq 1 12); do
            if curl --max-time 20 --retry 2 -fsSL "https://toolsbravo.com/word-counter.html" -o /tmp/tool-page && grep -q 'data-feedback-widget="word-counter"' /tmp/tool-page && grep -q 'assets/feedback.js' /tmp/tool-page; then break; fi
            sleep 15
          done
          grep -q 'data-feedback-widget="word-counter"' /tmp/tool-page
          grep -q 'assets/feedback.js' /tmp/tool-page
          curl --max-time 20 -fsSL 'https://toolsbravo.com/admin/feedback.html' -o /tmp/admin-page
          grep -q 'feedback_admins' /tmp/admin-page
          curl --max-time 20 -fsSL 'https://toolsbravo.com/privacy.html' -o /tmp/privacy-page
          grep -q 'Optional feedback' /tmp/privacy-page
          echo "Production feedback pages verified."
      - name: Record verified deployment
        shell: bash
        run: |
          mkdir -p docs
          printf 'ToolsBravo feedback production verification passed at %s UTC\nVerified: word-counter feedback widget, admin dashboard, privacy notice\n' "$(date -u +'%Y-%m-%d %H:%M:%S')" > docs/production-verification.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/production-verification.txt
          git commit -m "ci: record successful feedback production verification"
          git push
