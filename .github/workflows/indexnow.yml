name: IndexNow ping
# After each push to main, tell IndexNow search engines (Bing and others) which public pages changed.
# Run manually with "all pages" to submit every sitemap URL. Google doesn't use IndexNow; it reads the sitemap.
on:
  push:
    branches: [main]
    paths: ['*.html', 'sitemap.xml']
  workflow_dispatch:
    inputs:
      all:
        description: 'Submit every URL in sitemap.xml'
        type: boolean
        default: false
jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Notify IndexNow
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.all }}" = "true" ]; then
            node scripts/indexnow.mjs --all
          elif [ "${{ github.event_name }}" = "push" ]; then
            node scripts/indexnow.mjs "${{ github.event.before }}" "${{ github.sha }}"
          else
            node scripts/indexnow.mjs HEAD~1 HEAD
          fi
