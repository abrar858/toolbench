name: Feedback feature validation
on:
  push:
    branches: [feature/tool-feedback-20261118]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate static site
        run: node scripts/build.mjs
      - name: Verify generated pages
        run: node scripts/build.mjs --check
      - name: Run all Node tests
        run: node --test tests/*.test.mjs
      - name: Commit generated site pages on feature branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "build: regenerate feedback-enabled static pages"
            git push
          fi
