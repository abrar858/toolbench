name: Build admin portal feature
on:
  push:
    branches: [feature/admin-portal-20261118]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static pages
        run: node scripts/build.mjs
      - name: Commit generated pages
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "build: add admin footer navigation to generated pages"
            git push
          fi
      - name: Verify static output
        run: node scripts/build.mjs --check
      - name: Run Node tests
        run: node --test tests/*.test.mjs
