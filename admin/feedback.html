<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Feedback admin | ToolsBravo</title>
<style>body{font:16px system-ui,sans-serif;background:#f4f6f8;color:#152a43;margin:0}header{background:#0b2545;color:white;padding:18px max(16px,calc((100% - 1050px)/2))}main{max-width:1050px;margin:25px auto;padding:0 16px}.card{background:white;border:1px solid #d8e0e7;border-radius:12px;padding:18px;margin:15px 0}label{display:block;margin:12px 0 5px}input,select,button{font:inherit;padding:10px;border-radius:7px;border:1px solid #9cabb9}button{background:#0f766e;color:white;cursor:pointer}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left;vertical-align:top}td p{white-space:pre-wrap;overflow-wrap:anywhere;max-width:420px}.scroll{overflow-x:auto}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#536778}#dashboard[hidden],#login[hidden]{display:none!important}</style></head>
<body><header><strong>ToolsBravo · Feedback administration</strong></header><main>
<p class="muted">Private moderation dashboard. Only authorised administrator accounts can access submissions.</p>
<section id="login" class="card"><h1>Admin sign in</h1><form id="sign-in"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><p><button>Sign in</button></p></form></section>
<section id="dashboard" hidden><div class="row"><h1>Feedback reports</h1><button id="logout">Sign out</button></div><div class="card row"><label>Type <select id="category"><option value="">All</option><option>review</option><option>bug</option><option>feature</option><option>other</option></select></label><label>Status <select id="status-filter"><option value="">All</option><option>pending</option><option>approved</option><option>investigating</option><option>resolved</option><option>rejected</option></select></label><button id="refresh">Refresh</button><button id="export">Export visible CSV</button></div><div class="card"><p id="summary"></p><div class="scroll"><table><thead><tr><th>Date</th><th>Tool</th><th>Type</th><th>Rating</th><th>Message</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div><p id="page-info"></p><button id="previous">Previous</button> <button id="next">Next</button></div></section>
<p id="notice" role="status" aria-live="polite"></p></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.8';
const db=createClient('https://egypshduxktdyubwiaoo.supabase.co','sb_publishable_oHWkLFn8yqzyzXIotRRFuQ_E5tPOmjg');
const $=id=>document.getElementById(id);let page=0,visible=[],total=0;const limit=25;
const notice=t=>$('notice').textContent=t;
const cell=(tr,v)=>{const td=document.createElement('td');td.textContent=v??'';tr.append(td);return td;};
async function authorised(){const {data:{user}}=await db.auth.getUser();if(!user)return false;const {data,error}=await db.from('feedback_admins').select('user_id').eq('user_id',user.id).maybeSingle();return !error&&!!data;}
async function gate(){const yes=await authorised();$('login').hidden=yes;$('dashboard').hidden=!yes;if(yes)await load();else notice('Sign in with an authorised administrator account.');}
async function load(){notice('Loading…');let q=db.from('tool_feedback').select('id,created_at,tool_slug,category,rating,message,status',{count:'exact'}).order('created_at',{ascending:false}).range(page*limit,(page+1)*limit-1);if($('category').value)q=q.eq('category',$('category').value);if($('status-filter').value)q=q.eq('status',$('status-filter').value);const {data,error,count}=await q;if(error){notice('Unable to load feedback: '+error.message);return;}visible=data||[];total=count||0;$('rows').replaceChildren();for(const item of visible){const tr=document.createElement('tr');cell(tr,new Date(item.created_at).toLocaleString('en-GB'));cell(tr,item.tool_slug);cell(tr,item.category);cell(tr,item.rating??'—');cell(tr,item.message);const td=document.createElement('td');const select=document.createElement('select');for(const s of ['pending','approved','investigating','resolved','rejected']){const o=document.createElement('option');o.value=o.textContent=s;select.append(o);}select.value=item.status;select.setAttribute('aria-label','Status for '+item.tool_slug);select.addEventListener('change',async()=>{select.disabled=true;const {error}=await db.from('tool_feedback').update({status:select.value}).eq('id',item.id);select.disabled=false;if(error){select.value=item.status;notice('Update failed: '+error.message);}else{item.status=select.value;notice('Status updated.');}});td.append(select);tr.append(td);$('rows').append(tr);}$('summary').textContent=total+' matching submissions';$('page-info').textContent='Page '+(page+1)+' · '+visible.length+' shown';$('previous').disabled=page===0;$('next').disabled=(page+1)*limit>=total;notice('');}
$('sign-in').addEventListener('submit',async e=>{e.preventDefault();notice('Signing in…');const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){notice(error.message);return;}await gate();});
$('logout').addEventListener('click',async()=>{await db.auth.signOut();await gate();});
for(const id of ['category','status-filter'])$(id).addEventListener('change',()=>{page=0;load();});
$('refresh').addEventListener('click',load);$('previous').addEventListener('click',()=>{page=Math.max(0,page-1);load();});$('next').addEventListener('click',()=>{page++;load();});
$('export').addEventListener('click',()=>{const columns=['created_at','tool_slug','category','rating','message','status'];const csv=[columns.join(','),...visible.map(row=>columns.map(k=>'"'+(/^[\\s]*[=+@-]/.test(String(row[k]??''))?"'":"")+String(row[k]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='toolsbravo-feedback-page-'+(page+1)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
gate();
</script></body></html>
